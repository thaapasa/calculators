name: Test Calculators

on: [workflow_dispatch, push]

jobs:
  build:
    name: Build and test calculators
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Runs `mise install`, which installs Node and Yarn and then the
      # dependencies through the postinstall hook in mise.toml.
      - name: Install tools and dependencies
        uses: jdx/mise-action@v3

      # ESLint also checks the Prettier formatting.
      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test
